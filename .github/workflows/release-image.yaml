name: Release Hwameistor Operator

on:
  push:
    branches:
      - main
      - release/v1.0
      - release/v1.1
    paths:
      - "helm/operator/Chart.yaml"
  workflow_dispatch:
    inputs:
      release_tag:
        required: true
        type: string
      branch:
        required: true
        type: string

jobs:
  release-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.notes.outputs.version }}
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch || github.sha }}
      - name: Record release source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Read reviewed release notes
        id: notes
        uses: hwameistor/release-assistant@08fb6099ad17c568acc8b1b7ac5b61ed226c4c8d # Release Assistant
        with:
          command: release-body
          source-ref: ${{ steps.source.outputs.sha }}
          chart-path: helm/operator/Chart.yaml
          version: ${{ inputs.release_tag }}
          token: ${{ github.token }}
      - name: Include release notes in chart
        env:
          RELEASE_NOTES_FILE: ${{ steps.notes.outputs.body-path }}
        run: cp -- "$RELEASE_NOTES_FILE" helm/operator/RELEASE_NOTES.md
      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.7.1
      - name: Set env
        run: echo "GIT_ORG=$( echo ${{ github.repository_owner }} | tr 'A-Z' 'a-z' )" >> $GITHUB_ENV
      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.3.0
        with:
          charts_dir: helm
          charts_repo_url: https://${GIT_ORG}.github.io/hwameistor-operator
          config: helm/.cr/config.yaml
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_RELEASE_NOTES_FILE: RELEASE_NOTES.md

  release-image:
    runs-on: ubuntu-latest
    needs:
      - release-chart
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release-chart.outputs.source-sha }}
      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          image: tonistiigi/binfmt:latest
          platforms: all
      - name: Available platforms
        run: echo ${{ steps.qemu.outputs.platforms }}
      - name: Login registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Set env
        env:
          CHART_VERSION: ${{ needs.release-chart.outputs.version }}
        run: |
          echo "RELEASE_TAG=$CHART_VERSION" >> "$GITHUB_ENV"
          echo "PROJECT_SOURCE_CODE_DIR=`echo ${GITHUB_WORKSPACE}`" >> $GITHUB_ENV
          echo "IMAGE_REGISTRY=`echo ghcr.io/$(echo ${{ github.repository_owner }} | tr 'A-Z' 'a-z')`" >> $GITHUB_ENV
      - name: Release image
        run: |
          PROJECT_SOURCE_CODE_DIR=${PROJECT_SOURCE_CODE_DIR} IMAGE_REGISTRY=${IMAGE_REGISTRY} RELEASE_TAG=${RELEASE_TAG} make release
