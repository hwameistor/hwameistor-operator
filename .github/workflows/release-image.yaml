name: Release Hwameistor Operator

on:
  push:
    branches:
      - main
      - release/v1.0
      - release/v1.1
    paths:
      - "helm/operator/Chart.yaml"
  workflow_dispatch:
    inputs:
      release_tag:
        required: true
        type: string
      branch:
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      source_sha: ${{ steps.metadata.outputs.source-sha }}
    steps:
      - name: Validate manual dispatch branch
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED_BRANCH: ${{ inputs.branch }}
        run: |
          if [ "$REQUESTED_BRANCH" != "$GITHUB_REF_NAME" ]; then
            echo 'Select the same workflow branch as the branch input.' >&2
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Read reviewed release metadata
        id: metadata
        uses: hwameistor/release-assistant@13bf3e86b82d0a921e7952310c7bd0d2d9198bce
        with:
          command: release-body
          source-ref: ${{ github.sha }}
          version: ${{ inputs.release_tag }}
          chart-path: helm/operator/Chart.yaml
          token: ${{ github.token }}
      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Install Helm
        uses: azure/setup-helm@v1
        with:
          version: v3.7.1
      - name: Install chart-releaser
        uses: helm/chart-releaser-action@a0d2dc62c5e491af8ef6ba64a2e02bcf3fb33aa1 # v1.7.0
        with:
          version: v1.8.1
          install_only: true
        env:
          CR_TOKEN: ${{ github.token }}
      - name: Publish reviewed Chart release
        env:
          GH_TOKEN: ${{ github.token }}
          CR_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_SHA: ${{ steps.metadata.outputs.source-sha }}
          RELEASE_NOTES: ${{ steps.metadata.outputs.body-path }}
          RELEASE_PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
          RELEASE_LATEST: ${{ steps.metadata.outputs.make-latest }}
        run: |
          cr package helm/operator --config helm/.cr/config.yaml
          packages=(.cr-release-packages/*.tgz)
          test "${#packages[@]}" -eq 1 && test -f "${packages[0]}"
          CHART_PACKAGE="${packages[0]}" python3 .github/scripts/publish-chart.py
          cr index --owner "$GITHUB_REPOSITORY_OWNER" --git-repo "${GITHUB_REPOSITORY#*/}" --config helm/.cr/config.yaml --push

  release-image:
    runs-on: ubuntu-latest
    needs:
      - release-chart
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release-chart.outputs.source_sha }}
      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          image: tonistiigi/binfmt:latest
          platforms: all
      - name: Available platforms
        run: echo ${{ steps.qemu.outputs.platforms }}
      - name: Login registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Set env
        env:
          RELEASE_VERSION: ${{ needs.release-chart.outputs.version }}
        run: |
          echo "RELEASE_TAG=$RELEASE_VERSION" >> $GITHUB_ENV
          echo "PROJECT_SOURCE_CODE_DIR=`echo ${GITHUB_WORKSPACE}`" >> $GITHUB_ENV
          echo "IMAGE_REGISTRY=`echo ghcr.io/$(echo ${{ github.repository_owner }} | tr 'A-Z' 'a-z')`" >> $GITHUB_ENV
      - name: Release image
        run: |
          PROJECT_SOURCE_CODE_DIR=${PROJECT_SOURCE_CODE_DIR} IMAGE_REGISTRY=${IMAGE_REGISTRY} RELEASE_TAG=${RELEASE_TAG} make release
